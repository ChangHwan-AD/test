<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의 날짜와 시간</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }

        .card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 50px 60px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .date {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .time {
            font-size: 4rem;
            font-weight: 300;
            letter-spacing: 4px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="date">{{ now.strftime('%Y년 %m월 %d일') }}</div>
        <div class="time">{{ now.strftime('%H:%M:%S') }}</div>
    </div>
</body>
</html>
